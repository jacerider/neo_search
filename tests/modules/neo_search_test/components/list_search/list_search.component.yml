$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'List Search'
status: stable
description: 'Site search results: a prominent search input above a flat, relevance-ranked list of results — each a type badge, linked title and highlighted excerpt — with an applied-search chip, a live result count and a pager slot.'
neo: true
libraryOverrides:
  dependencies:
    - neo_alchemist/swap
props:
  type: object
  properties:
    label:
      type: string
      title: 'Heading'
      description: 'Optional heading shown above the search input.'
      examples:
        - 'Search'
    items:
      type: array
      title: 'Results'
      description: 'The search results. Each is a type badge, a linked title and an optional highlighted excerpt.'
      examples:
        -
          title: 'Water Reclamation Facility Expansion'
          link: { uri: 'internal:/', title: 'Water Reclamation Facility Expansion' }
          type: 'Project'
          icon: 'digging'
          excerpt: '… the <strong>water</strong> reclamation facility serves the region’s growing …'
        -
          title: 'Designing for Resilient Water Systems'
          link: { uri: 'internal:/', title: 'Designing for Resilient Water Systems' }
          type: 'Insight'
          icon: 'lightbulb'
          excerpt: '… resilient <strong>water</strong> systems start with careful planning …'
        -
          title: 'Water Resources'
          link: { uri: 'internal:/', title: 'Water Resources' }
          type: 'Market'
          icon: 'map-marked'
          excerpt: ''
      items:
        type: object
        title: 'Result'
        properties:
          title:
            type: string
            title: 'Title'
          link:
            type: url
            title: 'Link'
          type:
            type: string
            title: 'Type label'
            description: 'Small badge above the title, e.g. the content type.'
          icon:
            type: string
            title: 'Type icon'
            description: 'Icon name shown before the type badge (bind to _entity:icon_page for the bundle''s configured icon with System-to-Page conversion).'
          excerpt:
            type: string
            title: 'Excerpt'
            description: 'Highlighted snippet; <strong> marks the matched terms.'
    # The filter/summary props must stay declared AFTER `items`: their
    # providers read the views context that the items binding registers, and
    # props resolve in schema order.
    search_filter:
      type: views_filter
      title: 'Search filter'
      description: 'The fulltext search exposed filter, rendered as the page’s main search input in its own GET mini-form.'
      examples:
        label: 'Search'
        param: 's'
        multiple: false
        active: true
        active_count: 1
        active_labels: ['water']
        value: ['water']
        placeholder: 'Search'
        reset_url: '#'
        action: '#'
        carry: []
        options: []
    active_filters:
      type: views_active_filters
      title: 'Active filters'
      description: 'The applied search (and any other exposed filters) as removable chips with a clear-all link.'
      examples:
        active: true
        count: 1
        clear_url: '#'
        items:
          - { param: s, filter_label: Search, value: 'water', label: 'water', remove_url: '#' }
    summary:
      type: views_summary
      title: 'Result summary'
      description: 'The bound view''s result counts. Use summary.total for the real number of matches — items|length is only this page.'
      # Matches the three example results above so the editor preview reads
      # "3 results" next to three results instead of a number from nowhere.
      examples:
        total: 3
        count: 3
        start: 1
        end: 3
        page: 1
        pages: 1
        per_page: 20
        exact: true
    scheme:
      type: scheme
      title: 'Color scheme'
      apply: true
      examples: default
    spacing:
      type: spacing
      title: 'Spacing'
      examples: lg
    gap:
      type: gap
slots:
  header:
    title: 'Header'
    description: 'Region shown above the search input.'
  footer:
    title: 'Footer'
    description: 'Region shown below the results — the pager lives here.'
